      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="inner-border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
